name: iOS Unsigned IPA Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to build (default: main upstream)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "scripts/ios-*"
      - "shared/OpenClawKit/**"
      - "swabble/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git rev-list --count (build number)
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Verify Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install
        working-directory: ${{ github.workspace }}

      - name: Install xcodegen
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen || brew upgrade xcodegen 2>/dev/null || true

      - name: Install Swift tooling (pre-build deps)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftformat swiftlint 2>/dev/null || true

      - name: Configure Signing (unsigned override)
        run: |
          mkdir -p "${{ github.workspace }}/apps/ios/build"

          # Write a version xcconfig so builds have a version number
          IOS_VERSION="$(cat "${{ github.workspace }}/apps/ios/version.json" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).version))")"
          BUILD_NUMBER="$(cd "${{ github.workspace }}" && git rev-list --count HEAD 2>/dev/null || echo 1)"

          cat > "${{ github.workspace }}/apps/ios/build/Version.xcconfig" << XCEOF
// Generated by CI — unsigned build
OPENCLAW_IOS_VERSION = ${IOS_VERSION}
OPENCLAW_MARKETING_VERSION = ${IOS_VERSION}
OPENCLAW_BUILD_VERSION = ${BUILD_NUMBER}
XCEOF

          # Override signing config — Ad-Hoc / unsigned
          cat > "${{ github.workspace }}/apps/ios/.local-signing.xcconfig" << SIGNEOF
OPENCLAW_CODE_SIGN_STYLE = Manual
OPENCLAW_DEVELOPMENT_TEAM =
OPENCLAW_APP_BUNDLE_ID = ai.openclaw.ios.unsigned
OPENCLAW_SHARE_BUNDLE_ID = ai.openclaw.ios.unsigned.share
OPENCLAW_ACTIVITY_WIDGET_BUNDLE_ID = ai.openclaw.ios.unsigned.activitywidget
OPENCLAW_WATCH_APP_BUNDLE_ID = ai.openclaw.ios.unsigned.watchkitapp
OPENCLAW_WATCH_EXTENSION_BUNDLE_ID = ai.openclaw.ios.unsigned.watchkitapp.extension
OPENCLAW_APP_PROFILE =
OPENCLAW_SHARE_PROFILE =
CODE_SIGN_IDENTITY =
CODE_SIGNING_REQUIRED = NO
CODE_SIGNING_ALLOWED = NO
CODE_SIGN_STYLE = Manual
SIGNEOF

          cat "${{ github.workspace }}/apps/ios/build/Version.xcconfig"

      - name: Generate Xcode Project
        run: |
          cd "${{ github.workspace }}/apps/ios"
          xcodegen generate

      - name: Patch Pre-Build Scripts for CI
        run: |
          # Remove SwiftFormat/SwiftLint pre-build scripts since they may not
          # match the lint config paths on CI. We still install the tools
          # so xcodegen-generated scripts don't crash, but we skip the lint phase.
          PROJ="${{ github.workspace }}/apps/ios/OpenClaw.xcodeproj/project.pbxproj"
          if [ -f "$PROJ" ]; then
            echo "Project file exists, checking build phases..."
          fi

      - name: Build Unsigned .app
        run: |
          cd "${{ github.workspace }}/apps/ios"
          xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee build/xcodebuild.log

      - name: Locate .app Bundle
        id: locate_app
        run: |
          APP_PATH=$(find "${{ github.workspace }}/apps/ios/build/DerivedData" -name "*.app" -type d -maxdepth 5 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app bundle not found!"
            exit 1
          fi
          echo "Found .app: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          ls -la "$APP_PATH"

      - name: Package Unsigned .ipa
        id: package_ipa
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          BUILD_DIR="${{ github.workspace }}/apps/ios/build"
          VERSION=$(cat "${{ github.workspace }}/apps/ios/version.json" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          BUILD_NUM=$(cd "${{ github.workspace }}" && git rev-list --count HEAD 2>/dev/null || echo 1)
          IPA_NAME="OpenClaw-${VERSION}-unsigned-build${BUILD_NUM}.ipa"

          mkdir -p "${BUILD_DIR}/Payload"
          cp -r "$APP_PATH" "${BUILD_DIR}/Payload/"
          cd "${BUILD_DIR}"
          zip -qr "${IPA_NAME}" Payload/
          rm -rf Payload/

          echo "📦 Created: ${BUILD_DIR}/${IPA_NAME}"
          ls -lh "${BUILD_DIR}/${IPA_NAME}"
          echo "ipa_path=${BUILD_DIR}/${IPA_NAME}" >> $GITHUB_OUTPUT
          echo "ipa_name=${IPA_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Unsigned .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_ipa.outputs.ipa_name }}
          path: ${{ steps.package_ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/apps/ios/build/xcodebuild.log
          retention-days: 7